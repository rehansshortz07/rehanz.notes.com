<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Learn-Engineering</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
    }
    .reset-card {
        width: 100%;
        max-width: 400px;
        margin: 20px;
    }
    .password-input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }
    .password-input-wrapper input {
        width: 100%;
        padding-right: 42px;
    }
    .toggle-password-btn {
        position: absolute;
        right: 8px;
        background: none;
        border: none;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
        padding: 4px;
        opacity: 0.6;
    }
    .toggle-password-btn:hover {
        opacity: 1;
    }
    .hidden {
        display: none !important;
    }
    #resetStatus {
        font-size: 13px;
        margin-top: 10px;
        min-height: 18px;
    }
    #resetStatus.error {
        color: #c0392b;
    }
    #resetStatus.success {
        color: #1a7f37;
    }
    .continue-links {
        display: flex;
        gap: 12px;
        margin-top: 16px;
        flex-wrap: wrap;
    }
</style>
</head>
<body>

<div class="form-card reset-card">

    <div class="section-heading">
        <span class="section-icon faculty">🔑</span>
        <div>
            <span class="eyebrow">LEARN-ENGINEERING</span>
            <h2>Set a New Password</h2>
            <p id="resetIntro">Choose a new password for your account.</p>
        </div>
    </div>

    <form id="resetPasswordForm" class="smart-form">

        <div class="field">
            <label for="newPassword">New password</label>
            <div class="password-input-wrapper">
                <input id="newPassword" type="password" placeholder="Enter new password" autocomplete="new-password" minlength="6" required>
                <button type="button" class="toggle-password-btn" onclick="toggleField('newPassword', this)" aria-label="Show password">👁</button>
            </div>
        </div>

        <div class="field">
            <label for="confirmPassword">Confirm new password</label>
            <div class="password-input-wrapper">
                <input id="confirmPassword" type="password" placeholder="Re-enter new password" autocomplete="new-password" minlength="6" required>
                <button type="button" class="toggle-password-btn" onclick="toggleField('confirmPassword', this)" aria-label="Show password">👁</button>
            </div>
        </div>

        <button class="primary-btn" type="submit" id="resetSubmitBtn">Update Password <span>→</span></button>

        <div id="resetStatus"></div>

    </form>

    <div class="continue-links hidden" id="continueLinks">
        <a href="index.html" class="secondary-btn" style="text-decoration:none; text-align:center; flex:1;">Continue to Learn-Engineering</a>
        <a href="dean.html" class="secondary-btn" style="text-decoration:none; text-align:center; flex:1;">Continue to Management Portal</a>
    </div>

</div>

<script>
    const SUPABASE_URL = "https://vxzsqdrcuwesorystkdn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_amVCeTz9-6L4rKdvJqIn_A_QJ7J3Tc3";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            storage: window.localStorage
        }
    });

    function toggleField(inputId, buttonEl) {
        const input = document.getElementById(inputId);
        if (!input) return;
        const isHidden = input.type === "password";
        input.type = isHidden ? "text" : "password";
        buttonEl.textContent = isHidden ? "🙈" : "👁";
    }

    function setStatus(message, type) {
        const statusEl = document.getElementById("resetStatus");
        statusEl.textContent = message;
        statusEl.className = type || "";
    }

    document.addEventListener("DOMContentLoaded", async () => {

        // Supabase's detectSessionInUrl automatically exchanges the
        // recovery token in the URL for a temporary session. Give it
        // a moment, then confirm one actually exists before allowing
        // a password update — otherwise someone landing here directly
        // (no valid/expired link) would hit a confusing error later.
        const { data: { session } } = await supabaseClient.auth.getSession();

        if (!session) {
            setStatus(
                "This reset link is invalid or has expired. Please request a new one from the login page.",
                "error"
            );
            document.getElementById("resetSubmitBtn").disabled = true;
            return;
        }

        document.getElementById("resetPasswordForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (newPassword.length < 6) {
                setStatus("Password must be at least 6 characters.", "error");
                return;
            }

            if (newPassword !== confirmPassword) {
                setStatus("Passwords do not match.", "error");
                return;
            }

            const submitBtn = document.getElementById("resetSubmitBtn");
            submitBtn.disabled = true;
            setStatus("Updating password...", "");

            try {

                const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

                if (error) throw error;

                setStatus("Password updated successfully!", "success");
                document.getElementById("resetPasswordForm").classList.add("hidden");
                document.getElementById("continueLinks").classList.remove("hidden");

            } catch (error) {
                console.error("Password update error:", error);
                setStatus(error.message || "Could not update password. Please try again.", "error");
                submitBtn.disabled = false;
            }
        });
    });
</script>

</body>
</html>
