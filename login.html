<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Rehan Notes</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#081b3a,#0f2f5f,#1e4d8f);
}

.login-box{
background:white;
padding:40px;
border-radius:20px;
width:350px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

h1{
margin-bottom:10px;
color:#0f2f5f;
}

p{
margin-bottom:25px;
color:gray;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#38bdf8;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

</style>
</head>

<body>

<div class="login-box">

<h1>Rehan Notes</h1>

<p>Sign in using Google</p>

<button id="googleLogin">
Continue with Google
</button>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


const firebaseConfig = {
apiKey: "AIzaSyCp_dBpfDmH41-ppTX2mRjzu-TIO6NrraA",
authDomain: "notes-7671d.firebaseapp.com",
projectId: "notes-7671d",
storageBucket: "notes-7671d.firebasestorage.app",
messagingSenderId: "249462166446",
appId: "1:249462166446:web:d14ef1b3d4cd2f814f6e3f",
measurementId: "G-6HM2PCREZF"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();


// IF ALREADY LOGGED IN
onAuthStateChanged(auth, (user)=>{

if(user){

window.location.href = "index.html";

}

});


// LOGIN BUTTON
document.getElementById("googleLogin").addEventListener("click", ()=>{

signInWithPopup(auth, provider)

.then((result)=>{

window.location.href = "index.html";

})

.catch((error)=>{

alert(error.message);

});

});

</script>

</body>
</html>
